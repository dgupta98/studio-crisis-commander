# Cloud Build config for the backend — stage eval_cache + build + push + deploy.
#
# Two callers:
#   1. `scripts/deploy_backend.sh` (manual CLI runs — currently uses `gcloud
#      builds submit --tag`, will migrate to `--config=backend/cloudbuild.yaml`)
#   2. A Cloud Build Trigger on push to main (scoped by `backend/**` filter)
#
# The Dockerfile build context is `backend/`, which can't reach `../data/eval_cache/`.
# So step `stage-cache` copies the top-level cache into `backend/data/eval_cache/`
# before the image build so the demo triples ship inside the container.
#
# Secrets & env vars mirror scripts/deploy_backend.sh — Secret Manager entries
# (CLICKHOUSE_HOST, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD, CLICKHOUSE_DB) must
# already exist. Cloud Build SA needs Secret Manager Accessor on each secret,
# plus Cloud Run Admin + Service Account User to deploy.
#
# Tagging: `:latest` + `:${BUILD_ID}`. We don't use `$SHORT_SHA` because manual
# "Run trigger" clicks with no source commit leave it empty → invalid image
# ref. `${BUILD_ID}` is always populated regardless of trigger source.
options:
  # Required to reference built-in substitutions ($PROJECT_ID, $BUILD_ID)
  # inside user-defined substitution defaults below.
  dynamic_substitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s

substitutions:
  _IMAGE_BASE: gcr.io/${PROJECT_ID}/scc-api
  _SERVICE: scc-api
  _REGION: us-east1
  _VERTEX_LOCATION: us-east4
  _FLASH_MODEL: gemini-2.5-flash
  _PRO_MODEL: gemini-2.5-pro

steps:
  - id: stage-cache
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -d data/eval_cache ]; then
          echo "Staging data/eval_cache into backend/data/eval_cache"
          mkdir -p backend/data/eval_cache
          cp data/eval_cache/*.json backend/data/eval_cache/ 2>/dev/null || true
        else
          echo "No data/eval_cache directory to stage — continuing"
        fi

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - -t
      - ${_IMAGE_BASE}:latest
      - -t
      - ${_IMAGE_BASE}:${BUILD_ID}
      - .

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE_BASE}:latest"]

  - id: push-buildid
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE_BASE}:${BUILD_ID}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_IMAGE_BASE}:${BUILD_ID}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      # Keep one instance warm so the landing page LIVE TELEMETRY tile and
      # poster marquee never flash zeros while a cold start finishes. Also
      # matches the Cloud Run console's service-level minimum, which would
      # otherwise be overwritten to 0 on every redeploy.
      - --min-instances=1
      - --max-instances=5
      - --concurrency=4
      - --timeout=300
      # PipelineRuntime is process-local (in-memory dict). Without affinity,
      # a POST /inject-crisis on instance A followed by GET /stream/... can
      # land on instance B and 404 with "unknown run_id". Session affinity
      # sends a GOOGCLB cookie the LB uses to pin the client to one instance.
      - --session-affinity
      - --set-env-vars=CLICKHOUSE_PORT=8443,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION},GEMINI_MODEL_FLASH=${_FLASH_MODEL},GEMINI_MODEL_PRO=${_PRO_MODEL}
      - --set-secrets=CLICKHOUSE_HOST=CLICKHOUSE_HOST:latest,CLICKHOUSE_USER=CLICKHOUSE_USER:latest,CLICKHOUSE_PASSWORD=CLICKHOUSE_PASSWORD:latest,CLICKHOUSE_DB=CLICKHOUSE_DB:latest

images:
  - ${_IMAGE_BASE}:latest
  - ${_IMAGE_BASE}:${BUILD_ID}
