# Cloud Build config for the frontend — build + push + deploy in one pass.
#
# Two callers:
#   1. `scripts/deploy_frontend.sh` (manual CLI runs)
#   2. A Cloud Build Trigger on push to main (scoped by `frontend/**` filter)
#
# Substitutions (all have defaults so the trigger UI needs zero config):
#   _IMAGE_BASE    — image ref without tag, default gcr.io/$PROJECT_ID/scc-frontend
#   _VITE_API_URL  — baked into the JS bundle at build time (Vite reads it at build,
#                    NOT at runtime — changing it requires a fresh build)
#   _SERVICE       — Cloud Run service name
#   _REGION        — Cloud Run region
#
# Tagging: `:latest` (moves each build) + `:${BUILD_ID}` (immutable). We don't
# use `$SHORT_SHA` because manual "Run trigger" clicks with no source commit
# leave it empty → invalid image ref. `${BUILD_ID}` is always populated.
#
# Build context is set to `frontend/` via `dir:` because triggers check the
# full repo out at /workspace, but our Dockerfile assumes the frontend dir
# is the build root.
options:
  # Required to reference built-in substitutions ($PROJECT_ID, $BUILD_ID)
  # inside user-defined substitution defaults below.
  dynamic_substitutions: true
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE_BASE: gcr.io/${PROJECT_ID}/scc-frontend
  _VITE_API_URL: https://scc-api-845114229642.us-east1.run.app
  _SERVICE: scc-frontend
  _REGION: us-east1

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - -t
      - ${_IMAGE_BASE}:latest
      - -t
      - ${_IMAGE_BASE}:${BUILD_ID}
      - .

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE_BASE}:latest"]

  - id: push-buildid
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE_BASE}:${BUILD_ID}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_IMAGE_BASE}:${BUILD_ID}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=60

images:
  - ${_IMAGE_BASE}:latest
  - ${_IMAGE_BASE}:${BUILD_ID}
