# Cloud Build config for the frontend — build + push + deploy in one pass.
#
# Two callers:
#   1. `scripts/deploy_frontend.sh` (manual CLI runs)
#   2. A Cloud Build Trigger on push to main (scoped by `frontend/**` filter)
#
# Substitutions (all have defaults so the trigger UI needs zero config):
#   _IMAGE         — image ref, default gcr.io/$PROJECT_ID/scc-frontend:$SHORT_SHA
#   _LATEST_IMAGE  — floating `:latest` tag, for humans
#   _VITE_API_URL  — baked into the JS bundle at build time (Vite reads it at build,
#                    NOT at runtime — changing it requires a fresh build)
#   _SERVICE       — Cloud Run service name
#   _REGION        — Cloud Run region
#
# Build context is set to `frontend/` via `dir:` because triggers check the
# full repo out at /workspace, but our Dockerfile assumes the frontend dir
# is the build root.
substitutions:
  _IMAGE: gcr.io/$PROJECT_ID/scc-frontend:$SHORT_SHA
  _LATEST_IMAGE: gcr.io/$PROJECT_ID/scc-frontend:latest
  _VITE_API_URL: https://scc-api-845114229642.us-east1.run.app
  _SERVICE: scc-frontend
  _REGION: us-east1

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - -t
      - ${_IMAGE}
      - -t
      - ${_LATEST_IMAGE}
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, "${_LATEST_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_IMAGE}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=60

images:
  - ${_IMAGE}
  - ${_LATEST_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
